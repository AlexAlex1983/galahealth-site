<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — GALA Health</title>
  <meta name="description" content="Get in touch with GALA Health.">
  <link rel="icon" href="https://static.tildacdn.one/tild3131-6264-4636-b139-376137336363/Frame_2043683567.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="card card--lg">
        <div class="stack">
          <span class="pill">Gala Health</span>
          <h1 class="t-hero">Contact</h1>
          <p class="t-body">GALA Health supports governments to elevate chronic respiratory diseases (CRDs) from a neglected issue to a funded national priority.</p>
        </div>
        <img src="https://static.tildacdn.one/tild3839-3866-4435-b161-656561623862/__2026-05-07__232908.png" alt="Contact illustration" style="object-fit:contain">
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container contact-row">
      <div class="share">
        <span style="font-size:clamp(24px,2.2vw,36px)">Share options: <a href="https://x.com/GALA_Health" target="_blank" rel="noopener">X</a> · <a href="https://www.linkedin.com/company/gala-health/" target="_blank" rel="noopener">LinkedIn</a></span>
        <img src="https://static.tildacdn.one/tild3061-3935-4061-b138-343732316466/Frame_2043683560.png" alt="">
      </div>
      <a href="mailto:info@galahealth.org" class="t-hero" style="word-break:break-word">info@galahealth.org</a>
    </div>
  </section>

  <section class="section--tight">
    <div class="container">
      <div class="card card--navy mailing">
        <h2 class="t-hero">Join our mailing list</h2>
        <form data-gala-form="newsletter">
          <input class="input" type="email" name="email" placeholder="Email@gmail.com" required>
          <button class="btn btn--sky" type="submit">Subscribe</button>
        </form>
        <p class="form-msg" aria-live="polite" style="color:#fff;margin-top:14px"></p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/site.js"></script>
</body>
</html>
