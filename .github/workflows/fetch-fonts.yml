# Self-hosts the Manrope font. Runs when fetch-fonts.sh changes, or manually.
name: Fetch fonts
on:
  push:
    branches: [main]
    paths: [fetch-fonts.sh, .github/workflows/fetch-fonts.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash fetch-fonts.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Self-host Manrope font" && git push)
