# Copies any images still hosted on Tilda's CDN into assets/img/ and commits them.
# Runs automatically when this file or localize-images.sh changes, or manually from the Actions tab.
name: Localize images
on:
  push:
    branches: [main]
    paths: [localize-images.sh, .github/workflows/localize-images.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash localize-images.sh
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Copy images from Tilda CDN into assets/img" && git push)
